# Ensayo de desarrollo con un vehículo; la prueba final es two_vehicles.
# Definición del escenario, no es un archivo de parámetros ROS.
schema_version: 1
scenario: static_obstacles
purpose: development_only
final_scenario: two_vehicles
runtime_ready: true
map_ready: true
baseline_tag: parte-1-finalizada

base_files:
  simulator: src/f1tenth_gym_ros/config/sim.yaml
  controller: src/f1tenth_controller/config/follow_the_gap.yaml
  lap_tracker: src/f1tenth_controller/config/lap_tracker.yaml
  map_image: src/f1tenth_gym_ros/maps/Zandvoort_map.png
  map_metadata: src/f1tenth_gym_ros/maps/Zandvoort_map.yaml

map:
  image: src/f1tenth_gym_ros/maps/Zandvoort_obstacles.png
  metadata: src/f1tenth_gym_ros/maps/Zandvoort_obstacles.yaml
  launch_argument: map_path
  path_without_extension: src/f1tenth_gym_ros/maps/Zandvoort_obstacles

vehicles:
  - id: ego_racecar
    algorithm: follow_the_gap
    start: simulator_ego_pose

controller_profiles:
  ego_racecar: src/f1tenth_controller/config/obstacles.yaml

obstacles:
  count: 5
  type: static
  placement_and_dimensions: team_choice
  must_leave_traversable_passage: true
  must_affect_lidar_and_collision_detection: true
  fixed_during_attempt: true
  geometry_source: user_provided_map_with_first_obstacle_shortened
  # Las cajas delimitan los píxeles añadidos; el PNG define la forma exacta.
  objects:
  - id: 1
    geometry: occupied_map_pixels
    pixel_bbox:
    - 706
    - 240
    - 729
    - 255
    bbox_size_m:
    - 1.17507
    - 0.7663500000000001
    added_occupied_pixels: 239
  - id: 2
    geometry: occupied_map_pixels
    pixel_bbox:
    - 1717
    - 799
    - 1732
    - 814
    bbox_size_m:
    - 0.7663500000000001
    - 0.7663500000000001
    added_occupied_pixels: 161
  - id: 3
    geometry: occupied_map_pixels
    pixel_bbox:
    - 1411
    - 958
    - 1556
    - 980
    bbox_size_m:
    - 7.40805
    - 1.12398
    added_occupied_pixels: 2541
  - id: 4
    geometry: occupied_map_pixels
    pixel_bbox:
    - 465
    - 1001
    - 501
    - 1019
    bbox_size_m:
    - 1.8392400000000002
    - 0.9196200000000001
    added_occupied_pixels: 616
  - id: 5
