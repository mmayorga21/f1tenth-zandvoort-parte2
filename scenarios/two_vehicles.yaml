# Dos vehículos con cierre automático conjunto; rebase de comprobación visual.
# No es un archivo de parámetros ROS.
schema_version: 1
scenario: two_vehicles
purpose: final_evaluation
objective: overtake_dynamic_obstacle
runtime_ready: false  # Experimental tuning; repeatability is not yet validated.
integration_ready: true
map_ready: true
baseline_tag: parte-1-finalizada

integration:
  launch: ros2 launch f1tenth_controller two_vehicles.launch.py
  simulator: src/f1tenth_gym_ros/config/sim_two_vehicles.yaml
  completion: automatic_after_both_reach_target_and_stop
  ten_lap_runtime_validated: true
  repeatability_validated: false  # One of seven native trials detected wall contact.
  overtake_review: visual_observation_required

base_files:
  simulator: src/f1tenth_gym_ros/config/sim.yaml
  controller: src/f1tenth_controller/config/follow_the_gap.yaml
  lap_tracker: src/f1tenth_controller/config/lap_tracker.yaml
  map_image: src/f1tenth_gym_ros/maps/Zandvoort_map.png
  map_metadata: src/f1tenth_gym_ros/maps/Zandvoort_map.yaml

map:
  image: src/f1tenth_gym_ros/maps/Zandvoort_obstacles.png
  metadata: src/f1tenth_gym_ros/maps/Zandvoort_obstacles.yaml
  launch_argument: map_path
  path_without_extension: src/f1tenth_gym_ros/maps/Zandvoort_obstacles

vehicles:
  - id: ego_racecar
    role: primary_vehicle
    algorithm: follow_the_gap
    controller_parameters: src/f1tenth_controller/config/two_vehicles.yaml
    start: simulator_ego_pose
  - id: opp_racecar
    role: dynamic_obstacle
    algorithm: follow_the_gap
    controller_parameters_base: src/f1tenth_controller/config/two_vehicles.yaml
    # Nominal command factor; actual speeds also depend on each local scan.
    nominal_speed_ratio_to_primary: 0.66
    own_obstacle_and_corner_speed_limits: true
    start:
      relative_to: ego_racecar
      ahead_m: 5.0
      reference: vehicle_centers_along_start_straight
      heading: same_direction

obstacles:
  count: 5
  type: static
  objects_from: scenarios/static_obstacles.yaml
  fixed_during_attempt: true

session:
  independent_controllers: true
  independent_lap_counters: true
  common_start: true
  # El segundo vehículo facilita el alcance; no compite con el principal.
  competitive_ranking: false
  different_speed_profiles_allowed: true
  invalidate_on_collision_of_any_vehicle: true
  invalidate_on_command_loss_of_any_vehicle: true
  # Evita convertir al primer finalista en un obstáculo inmóvil sobre la pista.
  first_finisher: continue_driving_until_both_complete
  primary_speed_scale_after_ten_laps: 0.66
  record_first_ten_lap_times_for_each_vehicle: true
  stop_both_at_end: true

acceptance:
  full_consecutive_laps_per_vehicle: 10
  collisions_allowed: 0
  pauses_allowed: false
  resets_during_attempt_allowed: false
  timing: simulation_clock
  # Cada robot debe recorrer diez circuitos completos desde su propia salida.
  lap_reference: each_vehicle_start_gate
  finish_when: all_vehicles_complete
  overtakes_required: 1

overtake:
  overtaking_vehicle: ego_racecar
  overtaken_vehicle: opp_racecar
  must_start_behind: true
  must_finish_fully_ahead: true
  must_be_collision_free: true
  must_remain_inside_track: true
  must_occur_before_overtaker_completes_ten_laps: true
  measurement: visual_observation_of_simulation
  automatic_event_recording: false

pending_implementation:
  - resolve_wall_contact_during_overtaking
