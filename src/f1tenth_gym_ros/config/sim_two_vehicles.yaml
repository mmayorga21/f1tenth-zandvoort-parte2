# Two-vehicle integration with five static obstacles.
# The secondary starting pose is computed from the primary pose plus the offset.
bridge:
  ros__parameters:
    ego_namespace: ego_racecar
    ego_scan_topic: /ego_racecar/scan
    ego_odom_topic: odom
    ego_opp_odom_topic: opp_odom
    ego_drive_topic: /ego_racecar/drive
    opp_namespace: opp_racecar
    opp_scan_topic: /opp_racecar/scan
    opp_odom_topic: odom
    opp_ego_odom_topic: opp_odom
    opp_drive_topic: /opp_racecar/drive
    scan_distance_to_base_link: 0.0
    scan_fov: 4.7
    scan_beams: 1080
    map_path: Zandvoort_obstacles
    map_img_ext: .png
    num_agent: 2
    sx: 0.0
    sy: 0.0
    stheta: 1.1954730407943466
    kb_teleop: false
    drive_timeout_s: 0.3
    opponent_start_offset_m: 5.0
    target_laps: 10
    stopping_deceleration_mps2: 6.0
    event_log_path: ~/.ros/f1tenth_zandvoort/two_vehicle_events.jsonl
