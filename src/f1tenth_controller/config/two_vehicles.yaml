# Two-vehicle profile with independent speed scaling in sim_two_vehicles.yaml.
gap_follower:
  ros__parameters:
    use_sim_time: true
    front_half_angle_rad: 1.5707963267948966
    max_range_m: 6.0
    safety_radius_m: 0.3
    disparity_threshold_m: 0.45
    free_threshold_m: 1.0
    minimum_gap_angle_rad: 0.06
    filter_window: 3
    target_window: 31
    heading_weight: 0.12
    continuity_weight: 0.08
    wheelbase_m: 0.3302
    lookahead_m: 1.4
    max_steering_rad: 0.4189
    max_steering_rate_rad_s: 2.0
    steering_time_constant_s: 0.08
    max_speed_mps: 12.0
    min_speed_mps: 0.65
    max_acceleration_mps2: 5.0
    emergency_front_distance_m: 0.45
    front_clearance_half_angle_rad: 0.14
    lateral_acceleration_limit_mps2: 8.0
    braking_deceleration_mps2: 5.0
    scan_timeout_s: 0.3
    status_timeout_s: 0.5
    max_scan_age_s: 0.15
    yield_on_blocked_gap: true
